<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Orbit – keine Verbindung</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#000;color:#fff;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:2rem}
  main{max-width:24rem}
  .logo{width:72px;height:72px;margin:0 auto 1.5rem}
  h1{font-size:1.375rem;margin:0 0 .5rem}
  p{color:#a3a3a3;margin:0 0 1.5rem}
  button{min-height:44px;padding:0 1.25rem;border:0;border-radius:12px;background:#F6BB12;color:#000;font:600 15px/1 inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="11" fill="#F6BB12"/><ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#fff" stroke-width="3" transform="rotate(-24 32 32)"/><circle cx="51" cy="22" r="4" fill="#fff"/></svg>
  <h1 lang="de">Keine Verbindung</h1>
  <p lang="de">Orbit braucht Internet. Sobald du wieder online bist, geht es weiter.</p>
  <p lang="en">Orbit needs a connection. It will continue as soon as you are back online.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen · Retry</button>
</main>
</body>
</html>
