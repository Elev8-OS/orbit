# ─────────────────────────────────────────────────────────────
# Orbit App-Registry
#
# Jede App erscheint als Kachel, wenn der User mindestens eine der
# unter "roles" genannten Entra App Roles hat. Wer die Admin-Rolle
# (ORBIT_ADMIN_ROLE, Standard "Orbit.Admin") hat, sieht alles.
#
# Wichtig: Das Ausblenden einer Kachel ist KEIN Zugriffsschutz.
# Jedes Tool muss den Login selbst prüfen – nativ über Entra oder
# über einen vorgeschalteten Auth-Proxy (siehe proxy/README.md).
#
# "requestableBy" legt fest, wer eine App über "Zugriff anfragen"
# anfordern kann. Ohne Eintrag bleibt die App für alle anderen unsichtbar
# – sinnvoll, damit externe Partner keine internen Tools sehen.
#
# "embed: true" öffnet die App als Tab innerhalb von Orbit (Standard).
# Voraussetzung: Das Tool prüft den Orbit-Pass und erlaubt die Einbettung
# durch Orbit. "embed: false" öffnet im neuen Browser-Tab (z.B. Jira).
#
# Prüfen: npm run apps:check
# ─────────────────────────────────────────────────────────────

categories:
  - id: reporting
    name: { de: Reporting & KPIs, en: Reporting & KPIs }
    color: "#F6BB12"
  - id: revenue
    name: { de: Umsatz & Preise, en: Revenue & pricing }
    color: "#8C6D1F"
  - id: operations
    name: { de: Betrieb, en: Operations }
    color: "#C8A84B"
  - id: guests
    name: { de: Gäste, en: Guests }
    color: "#A3A3A3"
  - id: internal
    name: { de: Intern, en: Internal }
    color: "#6B6B6B"
  - id: sales
    name: { de: Vertrieb, en: Sales }
    color: "#F6BB12"
  - id: support
    name: { de: Kundensupport, en: Customer support }
    color: "#C8A84B"
  - id: customers
    name: { de: Kunden, en: Customers }
    color: "#F6BB12"

apps:
  # Elev8 Reporting Tool – öffnet als Tab in Orbit. Anmeldung über den Orbit-Pass,
  # ERT leitet danach je nach Rolle auf die passende Startseite.
  - id: ert
    name: { de: Elev8 Reporting Tool, en: Elev8 Reporting Tool }
    description:
      de: Umsatz, Lizenzen, Sales-Pipeline, Support und Roadmap der Elev8 Suite auf einen Blick.
      en: Elev8 Suite revenue, licences, sales pipeline, support and roadmap at a glance.
    url: https://ert.elev8-suite.com/api/auth/orbit
    icon: ChartNoAxesCombined
    category: reporting
    roles: [App.ERT.Admin, App.ERT.Management, App.ERT.Sales, App.ERT.Investor, App.ERT.Support]
    requestableBy: [Orbit.Staff]
    embed: true

  # Revenue Desk (AirROI) – Markt-Radar, Pacing, Comp-Sets, Preise und Kunden-Reports.
  # Geteilte Kunden-Reports (insights.elev8-suite.com/r/…) bleiben öffentlich.
  - id: revenue-desk
    name: { de: Revenue Desk, en: Revenue Desk }
    description:
      de: Marktdaten, Comp-Sets, Preisempfehlungen und Kunden-Reports aus AirROI.
      en: Market data, comp sets, price recommendations and client reports from AirROI.
    url: https://insights.elev8-suite.com/
    icon: TrendingUp
    category: revenue
    roles: [App.RevenueDesk]
    requestableBy: [Orbit.Staff]
    embed: true

  # Offerten – direkt in Orbit gebaut (/offerten). Öffnet als Tab, gleiche Anmeldung wie Orbit.
  - id: offerten
    name: { de: Offerten, en: Offers }
    description:
      de: Angebote aus Democalls automatisch vorbereiten, anpassen und als PDF oder Excel versenden.
      en: Prepare offers from demo calls automatically, adjust them and send them as PDF or Excel.
    url: https://myorbit.elev8-suite.com/offerten
    icon: FilePen
    category: sales
    roles: [App.Offerten, App.Offerten.Admin]
    requestableBy: [Orbit.Staff]
    embed: true

  # Sales – direkt in Orbit gebaut (/sales). Termine, Follow-ups und Pipeline des eigenen GHL-Users,
  # live aus GHL gelesen und dorthin zurückgeschrieben. Calls kommen aus dem Fireflies-Webhook der Offerten.
  - id: sales
    name: { de: Sales, en: Sales }
    description:
      de: Deine Termine, fälligen Follow-ups, Gespräche ohne nächsten Schritt und deine Pipeline aus GHL.
      en: Your meetings, due follow-ups, calls without a next step and your pipeline from GHL.
    url: https://myorbit.elev8-suite.com/sales
    icon: Target
    category: sales
    roles: [App.Sales, App.Sales.Admin]
    requestableBy: [Orbit.Staff]
    embed: true

  # Partnerportal (orbit.elev8-suite.com, Repo Elev8-onboarding Zweig v4, Railway-Projekt "Orbit") – Verwaltung
  # der Sales Partner: Personen, Bewerbungen, Budgetanträge, Akademie-Inhalte, Lead Harvester, Ansicht als Partner.
  # Öffnet als Tab, Anmeldung über den Orbit-Pass (/api/auth/orbit prüft Pass und Rolle).
  # Partner und Kunden melden sich dort weiterhin selbst an; sie brauchen kein myorbit-Konto.
  - id: partnerportal
    name: { de: Partnerportal, en: Partner portal }
    description:
      de: Sales Partner und ihre Kunden verwalten – Personen, Bewerbungen, Budgets, Akademie und Lead Harvester.
      en: Manage sales partners and their customers – people, applications, budgets, academy and lead harvester.
    url: https://orbit.elev8-suite.com/api/auth/orbit
    icon: Handshake
    category: sales
    roles: [App.PartnerPortal.Admin]
    requestableBy: [Orbit.Staff]
    embed: true

  # Lead Bot – WhatsApp-Leads mit Claude qualifizieren und zur Demo führen (Repo whatsapp_lead_converter,
  # Railway-Dienst lead-bot). Öffnet als Tab, Anmeldung über den Orbit-Pass.
  - id: lead-bot
    name: { de: Lead Bot, en: Lead Bot }
    description:
      de: WhatsApp-Leads mit Claude qualifizieren, Demo-Links senden und Gespräche verfolgen.
      en: Qualify WhatsApp leads with Claude, send demo links and follow conversations.
    url: https://add-converter.elev8-suite.com/admin/
    icon: MessageCircle
    category: sales
    roles: [App.LeadBot]
    requestableBy: [Orbit.Staff]
    embed: true
    # Übergebene Gespräche in „Mein Tag“, Leads in Suche und Kunden-360 (src/orbit-api.js im Bot)
    integrations:
      today: https://add-converter.elev8-suite.com/orbit/today
      search: https://add-converter.elev8-suite.com/orbit/search
      customer: https://add-converter.elev8-suite.com/orbit/customer

  # Support Bot – WhatsApp-Support für Bestandskunden mit desk365-Tickets und Lark-Eskalation
  # (gleiches Repo, Railway-Dienst support-bot). Öffnet als Tab, Anmeldung über den Orbit-Pass.
  - id: support-bot
    name: { de: Support Bot, en: Support Bot }
    description:
      de: WhatsApp-Support für Kunden mit Tickets in desk365, Wissensbasis und Reports.
      en: WhatsApp support for customers with desk365 tickets, knowledge base and reports.
    url: https://support-bot.elev8-suite.com/admin/
    icon: LifeBuoy
    category: support
    roles: [App.SupportBot]
    requestableBy: [Orbit.Staff]
    embed: true
    # Tickets ohne Antwort in „Mein Tag“, Tickets in Suche und Kunden-360 (src/orbit-api.js im Bot)
    integrations:
      today: https://support-bot.elev8-suite.com/orbit/today
      search: https://support-bot.elev8-suite.com/orbit/search
      customer: https://support-bot.elev8-suite.com/orbit/customer

  # OTA Listing QA – Inserate auf Airbnb und Booking.com mit Vier-Augen-Prinzip prüfen
  # (Repo ota-listing-qa, Railway-Projekt ota-listing-qa). Öffnet als Tab, Anmeldung über den Orbit-Pass.
  # Rollen im Tool kommen aus Entra: App.OtaQA (Bearbeiter), App.OtaQA.Reviewer (Prüfer), App.OtaQA.Admin.
  - id: ota-qa
    name: { de: OTA Listing QA, en: OTA Listing QA }
    description:
      de: Inserate auf Airbnb und Booking.com prüfen, Texte mit Claude verbessern und im Vier-Augen-Prinzip freigeben.
      en: Check Airbnb and Booking.com listings, improve texts with Claude and approve them with a second pair of eyes.
    url: https://ota-qa.elev8-suite.com/
    icon: ListChecks
    category: revenue
    roles: [App.OtaQA, App.OtaQA.Reviewer, App.OtaQA.Admin]
    requestableBy: [Orbit.Staff]
    embed: true

  # Kunden-360 – direkt in Orbit gebaut (/kunden). Alles zu einem Kunden auf einer Seite: GHL, Calls, Offerten
  # und was andere Apps über ihre Kunden-Schnittstelle liefern. Rollen: KUNDEN_ROLES (Standard App.Kunden
  # sowie die Sales- und Offerten-Rollen). Siehe docs/PLATTFORM.md.
  - id: kunden
    name: { de: Kunden, en: Customers }
    description:
      de: Alles zu einem Kunden auf einer Seite – Gespräche, Offerten, Calls, Aufgaben, Support und ein Briefing von Noah.
      en: Everything about a customer on one page – conversations, offers, calls, tasks, support and a briefing from Noah.
    url: https://myorbit.elev8-suite.com/kunden
    icon: Building2
    category: customers
    roles: [App.Kunden, App.Sales, App.Sales.Admin, App.Offerten, App.Offerten.Admin]
    requestableBy: [Orbit.Staff]
    embed: true

  # Tenant-Aufnahme (ready.elev8-suite.com) – Onboarding neuer Tenants: Aufnahme mit Vorbelegung aus Elev8,
  # Verträge und Unterschrift (Repo Elev8-Services-Onboarding, Railway-Projekt tenant-intake).
  # Der interne Bereich (/admin) öffnet als Tab, Anmeldung über den Orbit-Pass. Das Formular für Tenants
  # (/f/…) bleibt öffentlich, damit Kunden ihren Link ohne Orbit-Konto öffnen.
  - id: tenant-intake
    name: { de: Tenant-Aufnahme, en: Tenant onboarding }
    description:
      de: Neue Tenants aufnehmen – vorausgefüllt aus Elev8, mit Verträgen und Unterschrift, bereit für den Go-live.
      en: Onboard new tenants – prefilled from Elev8, with contracts and signature, ready for go-live.
    url: https://ready.elev8-suite.com/admin
    icon: ClipboardCheck
    category: customers
    roles: [App.TenantIntake]
    requestableBy: [Orbit.Staff]
    embed: true

  # E-Mail-Assistent (Moneypenny für alle) – direkt in Orbit gebaut (/assistent). Jede Person verbindet ihr eigenes
  # Postfach; Noah sortiert neue E-Mails und legt Antwortentwürfe in Outlook an. Erst aktivieren, wenn die
  # Einrichtung in Entra erledigt ist und ASSISTENT_ENABLED=true gesetzt ist (docs/PLATTFORM.md).
  - id: assistent
    name: { de: E-Mail-Assistent, en: Email assistant }
    description:
      de: Noah sortiert deinen Posteingang und schreibt Antwortentwürfe in deinem Stil. Gesendet wird nur, was du freigibst.
      en: Noah sorts your inbox and writes reply drafts in your style. Only what you approve gets sent.
    url: https://myorbit.elev8-suite.com/assistent
    icon: Mail
    category: internal
    roles: [App.Assistent, Orbit.Staff]
    requestableBy: [Orbit.Staff]
    embed: true

  # Portfolio Monitoring Schweiz – direkt in Orbit gebaut (/portfolio). Wirtschaftlichkeit, Empfehlungen, Kosten pro Wohnung,
  # Exit-Simulator, Break-even und Prognose für Elevate Schweiz. Daten serverseitig aus Elev8 (ELEV8_MCP_*) und
  # MyDataValue (über mydatavalue-mcp, MDV_MCP_*). Rollen: App.PortfolioCH (ansehen), App.PortfolioCH.Edit (pflegen). Siehe docs/PORTFOLIO.md.
  - id: portfolio-ch
    name: { de: Portfolio Monitoring Schweiz, en: Portfolio monitoring Switzerland }
    description:
      de: Wirtschaftlichkeit, Empfehlungen und Kosten aller Schweizer Wohnungen – mit Exit-Simulator, Break-even und Prognose.
      en: Profitability, recommendations and costs of all Swiss apartments – with exit simulator, break-even and forecast.
    url: https://myorbit.elev8-suite.com/portfolio
    icon: Building2
    category: reporting
    roles: [App.PortfolioCH, App.PortfolioCH.Edit]
    requestableBy: [Orbit.Staff]
    embed: true
