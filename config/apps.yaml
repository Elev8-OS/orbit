# ─────────────────────────────────────────────────────────────
# Orbit App-Registry
#
# Jede App erscheint als Kachel, wenn der User mindestens eine der
# unter "roles" genannten Entra App Roles hat. Wer die Admin-Rolle
# (ORBIT_ADMIN_ROLE, Standard "Orbit.Admin") hat, sieht alles.
#
# Wichtig: Das Ausblenden einer Kachel ist KEIN Zugriffsschutz.
# Jedes Tool muss den Login selbst prüfen – nativ über Entra oder
# über einen vorgeschalteten Auth-Proxy (siehe proxy/README.md).
#
# "requestableBy" legt fest, wer eine App über "Zugriff anfragen"
# anfordern kann. Ohne Eintrag bleibt die App für alle anderen unsichtbar
# – sinnvoll, damit externe Partner keine internen Tools sehen.
#
# "embed: true" öffnet die App als Tab innerhalb von Orbit (Standard).
# Voraussetzung: Das Tool prüft den Orbit-Pass und erlaubt die Einbettung
# durch Orbit. "embed: false" öffnet im neuen Browser-Tab (z.B. Jira).
#
# Prüfen: npm run apps:check
# ─────────────────────────────────────────────────────────────

categories:
  - id: reporting
    name: { de: Reporting & KPIs, en: Reporting & KPIs }
    color: "#F6BB12"
  - id: revenue
    name: { de: Umsatz & Preise, en: Revenue & pricing }
    color: "#8C6D1F"
  - id: operations
    name: { de: Betrieb, en: Operations }
    color: "#C8A84B"
  - id: guests
    name: { de: Gäste, en: Guests }
    color: "#A3A3A3"
  - id: internal
    name: { de: Intern, en: Internal }
    color: "#6B6B6B"
  - id: sales
    name: { de: Vertrieb, en: Sales }
    color: "#F6BB12"

apps:
  # Elev8 Reporting Tool – öffnet als Tab in Orbit. Anmeldung über den Orbit-Pass,
  # ERT leitet danach je nach Rolle auf die passende Startseite.
  - id: ert
    name: { de: Elev8 Reporting Tool, en: Elev8 Reporting Tool }
    description:
      de: Umsatz, Lizenzen, Sales-Pipeline, Support und Roadmap der Elev8 Suite auf einen Blick.
      en: Elev8 Suite revenue, licences, sales pipeline, support and roadmap at a glance.
    url: https://ert.elev8-suite.com/api/auth/orbit
    icon: ChartNoAxesCombined
    category: reporting
    roles: [App.ERT.Admin, App.ERT.Management, App.ERT.Sales, App.ERT.Investor, App.ERT.Support]
    requestableBy: [Orbit.Staff]
    embed: true

  # Revenue Desk (AirROI) – Markt-Radar, Pacing, Comp-Sets, Preise und Kunden-Reports.
  # Geteilte Kunden-Reports (insights.elev8-suite.com/r/…) bleiben öffentlich.
  - id: revenue-desk
    name: { de: Revenue Desk, en: Revenue Desk }
    description:
      de: Marktdaten, Comp-Sets, Preisempfehlungen und Kunden-Reports aus AirROI.
      en: Market data, comp sets, price recommendations and client reports from AirROI.
    url: https://insights.elev8-suite.com/
    icon: TrendingUp
    category: revenue
    roles: [App.RevenueDesk]
    requestableBy: [Orbit.Staff]
    embed: true

  # Offerten – direkt in Orbit gebaut (/offerten). Öffnet als Tab, gleiche Anmeldung wie Orbit.
  - id: offerten
    name: { de: Offerten, en: Offers }
    description:
      de: Angebote aus Democalls automatisch vorbereiten, anpassen und als PDF oder Excel versenden.
      en: Prepare offers from demo calls automatically, adjust them and send them as PDF or Excel.
    url: https://myorbit.elev8-suite.com/offerten
    icon: FilePen
    category: sales
    roles: [App.Offerten, App.Offerten.Admin]
    requestableBy: [Orbit.Staff]
    embed: true
