# ─────────────────────────────────────────────────────────────
# Orbit Statusseite: überwachte Dienste
#
# Jeder Dienst wird alle 5 Minuten geprüft (ORBIT_STATUS_INTERVAL_MIN):
#   http:     Adresse, die antworten muss (Status unter 500 = erreichbar)
#   railway:  letzte Bereitstellung auf Railway (CRASHED oder FAILED = gestört).
#             Braucht RAILWAY_API_TOKEN (Account- oder Workspace-Token). Ohne Token wird nur http geprüft.
#   group:    apps (Kacheln in Orbit), background (Hintergrunddienste), integrations (Schnittstellen)
#   app:      id der Kachel aus apps.yaml (optional, für Mein Tag und Verlinkung)
#   alert:    false = keine Alarm-E-Mail bei Störung (Standard true)
# Alarme gehen an ORBIT_ALERT_TO (sonst ORBIT_ACCESS_REQUEST_TO) und optional an ORBIT_ALERT_WEBHOOK
# (Slack-, Teams- oder Lark-kompatibler Webhook mit {"text": "..."}).
# ─────────────────────────────────────────────────────────────

services:
  # ── Apps in Orbit ───────────────────────────────────────────
  - id: orbit
    name: Orbit
    group: apps
    http: https://myorbit.elev8-suite.com/api/health
    railway: { project: 016bdcda-5a7e-468c-bba4-e6437e25fcdc, service: f87a6aa5-045e-4127-b8a0-dc382d6827b6, environment: 64bee6b2-b258-41ee-8be9-e81ab6fd0490 }
